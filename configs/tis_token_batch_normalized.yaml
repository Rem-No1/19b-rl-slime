# Match the previous verl rollout correction: token TIS, upper truncation at
# 2.0, no rejection sampling, then normalize valid-token weights to mean 1.
use_tis: true
use_rs: false
tis_level: token
rs_level: token
tis_mode: truncate
tis_lower_bound: 0.0
tis_upper_bound: 2.0
rs_lower_bound: null
rs_upper_bound: null
rs_veto_threshold: null
tis_batch_normalize: true

